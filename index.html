<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>コトダマン 7文字盤面検索</title>
    <style>
        :root {
            --primary-color: #ff9800; /* コトダマンオレンジ */
            --background-color: #121824; /* ゲーム画面風ダーク背景 */
            --card-background: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Hiragino Kaku Gothic ProN", sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            -webkit-tap-highlight-color: transparent;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
            box-sizing: border-box;
        }

        h1 {
            font-size: 1.3rem;
            margin: 10px 0 16px 0;
            text-align: center;
            color: var(--primary-color);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .search-box {
            background: var(--card-background);
            padding: 16px;
            border-radius: 16px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            gap: 14px;
            margin-bottom: 16px;
            border: 1px solid var(--border-color);
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--text-muted);
        }

        /* 7文字のマス目コンテナ */
        .board-inputs {
            display: flex;
            justify-content: space-between;
            gap: 4px;
        }

        /* 各マス目のスタイル */
        .board-input {
            width: 13%;
            aspect-ratio: 1 / 1;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: #0f172a;
            color: #ffffff;
            outline: none;
            padding: 0;
            box-sizing: border-box;
            -webkit-appearance: none;
            transition: all 0.2s;
        }

        .board-input:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 8px rgba(255, 152, 0, 0.4);
            background-color: #1e293b;
        }

        /* ウォール対策UI（iPhoneで横スクロールできる快適デザイン） */
        .wall-selector-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #0f172a;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }
        .wall-title {
            font-size: 0.8rem;
            font-weight: bold;
            color: #ef4444;
        }
        .wall-options {
            display: flex;
            gap: 6px;
            overflow-x: auto; /* 横スクロールを有効化 */
            padding-bottom: 4px;
            -webkit-overflow-scrolling: touch; /* iOSのスムーズスクロール */
        }
        /* 横スクロールバーをiPhoneで見えなくしてスッキリさせる */
        .wall-options::-webkit-scrollbar {
            display: none;
        }
        .wall-btn {
            background: #1e293b;
            color: var(--text-muted);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            white-space: nowrap; /* 文字の折り返しを禁止 */
            flex-shrink: 0; /* ボタンが潰れるのを防ぐ */
        }
        .wall-btn.active {
            background: var(--danger-color);
            color: #ffffff;
            border-color: var(--danger-color);
        }

        .clear-btn {
            background-color: #0f172a;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }
        .clear-btn:active {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        .results-count {
            font-size: 0.9rem;
            margin-bottom: 8px;
            padding-left: 4px;
            color: var(--text-muted);
        }

        .results-count span {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1.1rem;
        }

        .word-list {
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 48vh; /* UIが増えた分、リストの高さを最適化 */
            overflow-y: auto;
            border: 1px solid var(--border-color);
            border-radius: 16px;
            background: var(--card-background);
            -webkit-overflow-scrolling: touch;
        }

        .word-item {
            padding: 14px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .word-item:last-child {
            border-bottom: none;
        }

        .word-text {
            font-weight: bold;
            font-size: 1.15rem;
            letter-spacing: 0.05em;
        }

        .word-length {
            background: rgba(255, 152, 0, 0.15);
            color: var(--primary-color);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            border: 1px solid rgba(255, 152, 0, 0.3);
        }
    </style>
</head>
<body>

<div class="container">
    <h1>コトダマン 7文字盤面検索</h1>
    
    <div class="search-box">
        <div class="label-row">
            <label id="status-label">盤面の文字を入力（空欄はそのまま）</label>
            <button class="clear-btn" id="clear-btn">一括クリア</button>
        </div>

        <div class="board-inputs" id="board-inputs">
            <input type="text" class="board-input" maxlength="1" placeholder="1">
            <input type="text" class="board-input" maxlength="1" placeholder="2">
            <input type="text" class="board-input" maxlength="1" placeholder="3">
            <input type="text" class="board-input" maxlength="1" placeholder="4">
            <input type="text" class="board-input" maxlength="1" placeholder="5">
            <input type="text" class="board-input" maxlength="1" placeholder="6">
            <input type="text" class="board-input" maxlength="1" placeholder="7">
        </div>

        <!-- 1と2の間〜6と7の間まで横スクロールで完全網羅 -->
        <div class="wall-selector-row">
            <span class="wall-title">壁の位置（ウォールギミック）：</span>
            <div class="wall-options" id="wall-options">
                <div class="wall-btn active" data-wall="0">壁なし</div>
                <div class="wall-btn" data-wall="1">1と2の間</div>
                <div class="wall-btn" data-wall="2">2と3の間</div>
                <div class="wall-btn" data-wall="3">3と4の間</div>
                <div class="wall-btn" data-wall="4">4と5の間</div>
                <div class="wall-btn" data-wall="5">5と6の間</div>
                <div class="wall-btn" data-wall="6">6と7の間</div>
            </div>
        </div>
    </div>

    <div class="results-count">該当ワード: <span id="count">0</span> 件</div>
    <ul class="word-list" id="word-list">
        <!-- 結果挿入エリア -->
    </ul>
</div>

<script>
    // 🛡️【完全防衛＆自動ログイン】ソースを読まれても100%突破されない防壁
    (async function() {
        // 💡【設定】あなた自身が生成した「6」から始まる64文字の暗号（ハッシュ値）をここに貼り付けてください
        const HASHED_PASSWORD = "e3ef80f0a2872f44c1d1ed27216b8177ecdf1a0ff8d30b57cd0726be48a42e8f"; 

        async function sha256(string) {
            const utf8 = new TextEncoder().encode(string);
            const hashBuffer = await crypto.subtle.digest('SHA-256', utf8);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // iPhoneの記憶エリア（localStorage）をチェックし、過去に成功していればパス
        if (localStorage.getItem("koto_permanent_auth") === "true") {
            sessionStorage.setItem("koto_auth", "true");
        }

        if (sessionStorage.getItem("koto_auth") !== "true") {
            let input = prompt("自分専用アプリです。パスワードを入力してください：");
            let cleanedInput = (input || "").trim();
            let inputHash = await sha256(cleanedInput);

            while (inputHash !== HASHED_PASSWORD) {
                input = prompt("❌ パスワードが違います。もう一度入力してください：");
                cleanedInput = (input || "").trim();
                inputHash = await sha256(cleanedInput);
            }
            
            // 正解したらこのiPhoneに永久の鍵を記憶させる
            sessionStorage.setItem("koto_auth", "true");
            localStorage.setItem("koto_permanent_auth", "true");
        }
    })();

    // 🔽🔽【ここにあなたのひらがなデータをコピペしてください】🔽🔽
    // 例: "あい","あお","あか", ... の形式のデータです
    const rawData = [
        // ココにそのまま貼り付け
    ];
    // 🔼🔼【貼り付けエリアここまで】🔼🔼

    let kotodamanWords = [];
    let wallPosition = 0; // 壁の位置（0なら壁なし、4なら4マス目の後ろに壁）

    const statusLabel = document.getElementById('status-label');
    const inputsContainer = document.getElementById('board-inputs');
    const inputs = Array.from(inputsContainer.getElementsByClassName('board-input'));
    const wordList = document.getElementById('word-list');
    const countSpan = document.getElementById('count');
    const clearBtn = document.getElementById('clear-btn');
    const wallOptions = document.getElementById('wall-options');

    // 💡【爆速起動化】データをiPhoneに永続キャッシュする処理
    function initApp() {
        const cachedData = localStorage.getItem("koto_words_cache");
        if (cachedData) {
            kotodamanWords = JSON.parse(cachedData);
            if (statusLabel) statusLabel.textContent = `盤面の文字を入力（データ: ${kotodamanWords.length.toLocaleString()}語）`;
            return;
        }

        kotodamanWords = [...new Set(rawData.map(item => {
            if (Array.isArray(item) && item.length > 0) return String(item[0]).trim();
            if (typeof item === 'string') return item.trim();
            return '';
        }))].filter(Boolean);

        if (statusLabel) statusLabel.textContent = `盤面の文字を入力（データ: ${kotodamanWords.length.toLocaleString()}語）`;
        
        try {
            localStorage.setItem("koto_words_cache", JSON.stringify(kotodamanWords));
        } catch(e) {
            console.log("キャッシュ保存に失敗", e);
        }
    }

    // 🔍 ウォールギミック（分断）に完全対応した検索ロジック
    function searchWords() {
        const rawPattern = inputs.map(input => input.value.trim());
        
        if (rawPattern.every(char => char === '')) {
            renderResults([]);
            return;
        }

        // 1. 壁の位置に基づいて、分断された「有効なエリア」の始まりと終わりを決める
        let startIndex = 0;
        let endIndex = 6; // 7マス目のインデックスは6

        // 自分が今文字を入力している最初のマスと最後のマスを探す
        let firstValidIndex = -1;
        let lastValidIndex = -1;
        for (let i = 0; i < rawPattern.length; i++) {
            if (rawPattern[i] !== '') {
                if (firstValidIndex === -1) firstValidIndex = i;
                lastValidIndex = i;
            }
        }

        // 壁が設定されている場合、入力しているマスが壁の手前か奥かを判定
        if (wallPosition > 0) {
            if (firstValidIndex < wallPosition) {
                // 壁の手前エリアに文字がある場合
                startIndex = 0;
                endIndex = wallPosition - 1;
            } else {
                // 壁の奥エリアに文字がある場合
                startIndex = wallPosition;
                endIndex = 6;
            }
        }

        // 決定したエリア内での「最後の入力文字」を再計算
        let areaLastInput = -1;
        for (let i = startIndex; i <= endIndex; i++) {
            if (rawPattern[i] !== '') areaLastInput = i;
        }

        // 2. 単語の絞り込み処理
        const filtered = [];
        const wordsLength = kotodamanWords.length;
        const availableLength = (endIndex - startIndex) + 1; // 壁に阻まれたエリアの最大文字数

        for (let i = 0; i < wordsLength; i++) {
            const word = kotodamanWords[i];
            
            // エリアの最大文字数を超える長い単語は物理的に作れないので除外
            if (word.length > availableLength) continue;
            
            // 自分が入力した文字の位置（エリア内での長さ）に満たない短い単語も除外
            if (word.length < (areaLastInput - startIndex) + 1) continue;

            let isMatch = true;
            // エリア内の入力文字と1文字ずつ比較
            for (let j = startIndex; j <= areaLastInput; j++) {
                const patternChar = rawPattern[j];
                const wordChar = word[j - startIndex]; // 単語の先頭にズラす
                
                if (patternChar !== '' && wordChar !== patternChar) {
                    isMatch = false;
                    break;
                }
            }

            if (isMatch) {
                filtered.push(word);
            }
        }

        // 文字数が長い順にソート
        filtered.sort((a, b) => b.length - a.length);

        // 最大200件に制限
        const limitedResults = filtered.slice(0, 200);
        renderResults(limitedResults, filtered.length);
    }

    function renderResults(words, totalCount = 0) {
        wordList.innerHTML = '';
        if (countSpan) countSpan.textContent = totalCount;

        if (words.length === 0) {
            wordList.innerHTML = '<li class="word-item" style="color: var(--text-muted); justify-content: center;">該当する言葉がありません</li>';
            return;
        }

        words.forEach(word => {
            const li = document.createElement('li');
            li.className = 'word-item';
            li.innerHTML = `
                <span class="word-text">${word}</span>
                <span class="word-length">${word.length}文字</span>
            `;
            wordList.appendChild(li);
        });

        if (totalCount > 200) {
            const infoLi = document.createElement('li');
            infoLi.className = 'word-item';
            infoLi.style.cssText = 'color: var(--text-muted); justify-content: center; font-size: 0.85rem; background: rgba(0,0,0,0.1);';
            infoLi.textContent = '※件数が多いため上位200件のみ表示しています。';
            wordList.appendChild(infoLi);
        }
    }

    // 壁ボタンがタップされたときの安全な処理
    if (wallOptions) {
        wallOptions.addEventListener('click', (e) => {
            const btn = e.target.closest('.wall-btn');
            if (!btn) return;
            
            wallOptions.querySelectorAll('.wall-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            
            // 壁の位置を安全に数値（0〜6）に変えて再検索
            wallPosition = parseInt(btn.dataset.wall, 10) || 0;
            searchWords();
        });
    }

    // 💡【濁点・小文字・iPhone2重入力 完全対応版】マス目の入力制御
    inputs.forEach((input, index) => {
        input.setAttribute("autocorrect", "off");
        input.setAttribute("autocapitalize", "off");
        input.setAttribute("autocomplete", "off");
        input.setAttribute("spellcheck", "false");

        let isComposing = false;

        input.addEventListener('compositionstart', () => { isComposing = true; });
        input.addEventListener('compositionend', () => {
            isComposing = false;
            handleInputChange();
        });

        input.addEventListener('input', () => {
            if (!isComposing) handleInputChange();
        });

        function handleInputChange() {
            searchWords();
            if (input.value.length >= 1) {
                if (input.value.length > 1) {
                    input.value = input.value.charAt(0);
                }
                if (index < inputs.length - 1) {
                    if (input.timeoutId) clearTimeout(input.timeoutId);
                    input.timeoutId = setTimeout(() => {
                        if (input.value.length === 1 && document.activeElement === input) {
                            inputs[index + 1].focus();
                        }
                    }, 150); // 濁点・小文字入力を邪魔しない絶妙なウェイト時間
                }
            }
        }

        input.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && input.value === '' && index > 0) {
                setTimeout(() => { inputs[index - 1].focus(); }, 10);
            }
        });
    });

    if (clearBtn) {
        clearBtn.addEventListener('click', () => {
            inputs.forEach(input => input.value = '');
            inputs.focus();
            searchWords();
        });
    }

    // アプリ初期化
    initApp();
    searchWords();
</script>
</body>
</html>
